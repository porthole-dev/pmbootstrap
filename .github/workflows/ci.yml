# Lint, test, check the docs, and check commits on pushes to main, pull
# requests and merge groups, and weekly against the moving alpine:latest image
# upstream's CI uses too. Mirrors upstream's .gitlab-ci.yml test stage: the jobs run
# the same .ci/*.sh scripts, as root in an Alpine container that drops to a
# "build" user, exactly as they do on GitLab.
#
# Not mirrored: mr-settings (checks GitLab merge request settings),
# deploy-docs (triggers upstream's docs site), and the integration-test stage
# (image and cross builds that need QEMU binfmt runners and hours of runtime).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled; every push to main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Unpinned like upstream's image: the weekly run catches what a new
    # Alpine release breaks.
    container: docker.io/library/alpine:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Prepare the container
        run: |
          apk upgrade -U
          apk add git
          adduser -D build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scripts drop to the build user, who writes tool caches here.
      - run: chown -R build .
      - name: Codespell
        run: .ci/codespell.sh
      - name: Ruff
        # Pinned to the last release before 0.16, which enabled rules the
        # upstream base of this fork was never linted with. .ci/ruff.sh then
        # finds it installed and keeps it.
        run: |
          apk add py3-pip
          pip install --break-system-packages --no-warn-script-location ruff==0.15.22
          .ci/ruff.sh
      - name: Vermin
        run: .ci/vermin.sh
      - name: Shellcheck and shfmt
        run: .ci/shellcheck_and_shfmt.sh
      - name: Mypy
        run: .ci/mypy.sh
      - name: Markdownlint
        run: .ci/markdown.sh

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: docker.io/library/alpine:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Prepare the container
        run: |
          apk upgrade -U
          apk add git
          adduser -D build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: chown -R build .
      - name: Build the documentation
        run: .ci/docs.sh

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Privileged, like the GitLab runners: the chroot tests mount tmpfs.
    container:
      image: docker.io/library/alpine:latest # zizmor: ignore[unpinned-images]
      options: --privileged
    steps:
      - name: Prepare the container
        run: |
          apk upgrade -U
          apk add git android-tools multipath-tools losetup
          adduser -D build
          su build -c 'git config --global user.email ci@example.org'
          su build -c 'git config --global user.name CI'
          echo 'build ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: chown -R build .
      - name: Run the test suite
        run: .ci/pytest.sh

  commit-check:
    name: Commit check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: porthole-dev/.github/actions/commit-check@06b66d018629f11ebf2e305940855793dbc0b775 # v1.0.0

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: porthole-dev/.github/actions/workflow-lint@06b66d018629f11ebf2e305940855793dbc0b775 # v1.0.0

  ci-passed:
    name: CI passed
    if: ${{ !cancelled() }}
    needs: [lint, docs, test, commit-check, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: porthole-dev/.github/actions/ci-passed@06b66d018629f11ebf2e305940855793dbc0b775 # v1.0.0
        with:
          results: ${{ join(needs.*.result, ' ') }}
